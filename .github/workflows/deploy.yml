name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: workdir

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0

      - name: sqlc diff
        run: sqlc diff

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Test (PostgreSQL contract + schema parity suites)
        env:
          CGO_ENABLED: "0"
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          CI_REQUIRE_POSTGRES: "1"
        run: |
          set -euo pipefail
          go test -v ./internal/database/... | tee /tmp/database-test.log
          if ! grep -q '^--- PASS: TestQuerierContract_Postgres' /tmp/database-test.log; then
            echo "::error::TestQuerierContract_Postgres did not run/pass against PostgreSQL"
            exit 1
          fi
          if ! grep -q '^--- PASS: TestSchemaParity' /tmp/database-test.log; then
            echo "::error::TestSchemaParity did not run/pass against PostgreSQL"
            exit 1
          fi

  build:
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          # PRs only verify the image builds; nothing is published.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL secret is not set"
            exit 1
          fi

          # Deploy by digest so the target pulls exactly the image built above.
          payload=$(jq -nc \
            --arg image "${IMAGE}@${DIGEST}" \
            --arg repository "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg tag "sha-${SHA}" \
            --arg sha "${SHA}" \
            --arg ref "${REF}" \
            '{image: $image, repository: $repository, digest: $digest, tag: $tag, sha: $sha, ref: $ref}')

          headers=(-H "Content-Type: application/json")
          if [ -n "${WEBHOOK_SECRET}" ]; then
            sig=$(printf '%s' "${payload}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | awk '{print $2}')
            headers+=(-H "X-Hub-Signature-256: sha256=${sig}")
          fi

          curl --fail-with-body -sS --retry 3 --retry-all-errors --max-time 30 \
            -X POST "${headers[@]}" --data "${payload}" "${WEBHOOK_URL}"
