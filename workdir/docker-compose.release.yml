services:
  # Runs the published release image instead of building from source. Point
  # REGISTRY_RELEASES at the image published by the `deploy` workflow on tag
  # pushes (e.g. docker.io/OWNER/gogoform) and IMAGE_TAG at the version to run.
  api:
    image: ${REGISTRY_RELEASES:?set REGISTRY_RELEASES to the release image, e.g. docker.io/OWNER/gogoform}:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-change-me-now}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      # Postgres 18+ keeps data in a versioned subdir (/var/lib/postgresql/18/docker),
      # so mount the parent. The volume was renamed because the old one holds PG 16 data.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Web UI to query the database: http://localhost:8088 (System: PostgreSQL,
  # Server: postgres, credentials from POSTGRES_USER / POSTGRES_PASSWORD).
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      # Adminer listens on 8080 inside the container, which the API uses on the host.
      - "${ADMINER_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18_data:
