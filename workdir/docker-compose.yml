services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subdir (/var/lib/postgresql/18/docker),
      # so mount the parent. The volume was renamed because the old one holds PG 16 data.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Web UI to query the database: http://localhost:8088 (System: PostgreSQL,
  # Server: postgres, credentials from POSTGRES_USER / POSTGRES_PASSWORD).
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      # Adminer listens on 8080 inside the container, which the API uses on the host.
      - "${ADMINER_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18_data:
