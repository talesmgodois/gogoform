basePath: /
definitions:
  auth.Role:
    enum:
    - ADMIN
    - FORM_CREATOR
    - BASIC
    - BASIC
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleFormCreator
    - RoleBasic
    - DefaultRole
  errors.Code:
    enum:
    - invalid_argument
    - unauthorized
    - forbidden
    - not_found
    - conflict
    - internal
    type: string
    x-enum-varnames:
    - CodeInvalidArgument
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeInternal
  errors.HTTPErrorResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/errors.Code'
        example: not_found
      message:
        example: form not found
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: UP
        type: string
      timestamp:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  handlers.CreateSubmissionRequest:
    properties:
      completion_time_seconds:
        description: CompletionTimeSeconds is how long the respondent took to fill
          the form in.
        example: 95
        minimum: 0
        type: integer
      payload:
        description: Payload holds the answers; any JSON value but null.
        type: object
    type: object
  handlers.CreateTenantRequest:
    properties:
      name:
        example: Acme Inc.
        type: string
    type: object
  handlers.CreateTenantResponse:
    properties:
      api_key:
        example: 3f1c...e9a0
        type: string
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Inc.
        type: string
    type: object
  handlers.CreateWebhookRequest:
    properties:
      secret_token:
        description: SecretToken, when set, is used to sign deliveries. It is never
          returned.
        example: s3cr3t
        type: string
      target_url:
        description: TargetURL must be a public http(s) URL.
        example: https://example.com/hooks/forms
        type: string
    type: object
  handlers.FileResponse:
    properties:
      checksum_sha256:
        description: Checksum is the hex-encoded SHA-256 of the content.
        example: 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824
        type: string
      content_type:
        example: image/png
        type: string
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 0b6a3b2e-8f1c-4c4e-9d5e-2f1a7c3b9e10
        type: string
      name:
        example: logo.png
        type: string
      size:
        example: 2048
        type: integer
      url:
        example: /files/0b6a3b2e-8f1c-4c4e-9d5e-2f1a7c3b9e10
        type: string
    type: object
  handlers.FormDetailsResponse:
    properties:
      accept_anonymous:
        example: true
        type: boolean
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      public_available:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      tenant_id:
        example: 1
        type: integer
      tenant_name:
        example: Acme Inc.
        type: string
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  handlers.FormListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.FormSummaryResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 1
        type: integer
    type: object
  handlers.FormRequest:
    properties:
      accept_anonymous:
        description: |-
          AcceptAnonymous forms store submissions without the submitter's
          identity; defaults to true and must be true for public forms.
        example: true
        type: boolean
      content:
        description: Content is the form definition (fields, layout); any JSON value
          but null.
        type: object
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      is_active:
        description: IsActive defaults to true when omitted.
        example: true
        type: boolean
      public_available:
        description: |-
          PublicAvailable forms can be read and filled in without signing in;
          defaults to true.
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      title:
        example: Contact us
        type: string
    type: object
  handlers.FormResponse:
    properties:
      accept_anonymous:
        example: true
        type: boolean
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      public_available:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      tenant_id:
        example: 1
        type: integer
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  handlers.FormSummaryResponse:
    properties:
      accept_anonymous:
        example: true
        type: boolean
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      public_available:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      submission_count:
        example: 42
        type: integer
      tenant_id:
        example: 1
        type: integer
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  handlers.MetadataResponse:
    properties:
      completion_time_seconds:
        example: 95
        type: integer
      ip_address:
        example: 203.0.113.7
        type: string
      referer:
        example: https://example.com/contact
        type: string
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  handlers.PublicFormResponse:
    properties:
      accept_anonymous:
        description: AcceptAnonymous is false for forms recording who submitted them.
        example: true
        type: boolean
      content:
        type: object
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      public_available:
        description: PublicAvailable is false for forms that require signing in.
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      title:
        example: Contact us
        type: string
    type: object
  handlers.SampleResponse:
    properties:
      message:
        example: Hello, alice
        type: string
      policy:
        description: Policy describes who may call the endpoint.
        example: signed in
        type: string
      user:
        allOf:
        - $ref: '#/definitions/handlers.UserResponse'
        description: User is the signed-in caller; null for anonymous calls.
    type: object
  handlers.SetRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/auth.Role'
        enum:
        - ADMIN
        - FORM_CREATOR
        - BASIC
        example: FORM_CREATOR
    type: object
  handlers.SignUpRequest:
    properties:
      password:
        description: Password is 8 to 72 bytes long.
        example: correct horse battery
        type: string
      username:
        description: 'Username is case-insensitive: 3 to 50 letters, digits, ''.'',
          ''_'' or ''-''.'
        example: alice
        type: string
    type: object
  handlers.SubmissionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.SubmissionResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
    type: object
  handlers.SubmissionResponse:
    properties:
      form_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      metadata:
        $ref: '#/definitions/handlers.MetadataResponse'
      payload:
        type: object
      submitted_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      user_id:
        description: UserID is the signed-in submitter; null for anonymous submissions.
        example: 3
        type: integer
    type: object
  handlers.TenantResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Inc.
        type: string
    type: object
  handlers.TokenResponse:
    properties:
      access_token:
        description: 'AccessToken is a JWT; send it as "Authorization: Bearer <token>".'
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_at:
        example: "2026-01-01T01:00:00Z"
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/handlers.UserResponse'
    type: object
  handlers.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.UserResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
    type: object
  handlers.UserResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      role:
        allOf:
        - $ref: '#/definitions/auth.Role'
        enum:
        - ADMIN
        - FORM_CREATOR
        - BASIC
        example: BASIC
      username:
        example: alice
        type: string
    type: object
  handlers.WebhookListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.WebhookResponse'
        type: array
    type: object
  handlers.WebhookResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      form_id:
        example: 1
        type: integer
      has_secret:
        example: true
        type: boolean
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      target_url:
        example: https://example.com/hooks/forms
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Username and password of a user: "Basic " + btoa(username + ":" +
    password).'
  title: App API
  version: "1.0"
paths:
  /auth/me:
    get:
      description: Returns the user authenticated by the bearer token or Basic credentials.
      produces:
      - application/json
      responses:
        "200":
          description: Signed-in user
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - BearerAuth: []
      - BasicAuth: []
      summary: Get the current user
      tags:
      - auth
  /auth/signin:
    post:
      description: 'Checks the HTTP Basic credentials ("Authorization: Basic " + btoa(username
        + ":" + password)) and returns a JWT access token to send as "Authorization:
        Bearer <token>".'
      produces:
      - application/json
      responses:
        "200":
          description: Signed in
          schema:
            $ref: '#/definitions/handlers.TokenResponse'
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - BasicAuth: []
      summary: Sign in
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates an account with the BASIC role. Usernames are case-insensitive.
      parameters:
      - description: Credentials of the new account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Username already taken
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      summary: Sign up
      tags:
      - auth
  /files:
    post:
      consumes:
      - multipart/form-data
      description: Stores the file sent in the "file" field of a multipart form. Files
        are limited to 10 MiB and can then be read publicly at the returned url.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: File uploaded
          schema:
            $ref: '#/definitions/handlers.FileResponse'
        "400":
          description: Invalid, missing, empty or too large file
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Upload a file
      tags:
      - files
  /files/{id}:
    delete:
      description: Deletes one of the authenticated tenant's files.
      parameters:
      - description: File ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: File deleted
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a file
      tags:
      - files
    get:
      description: 'Returns the raw content of a file, with its stored content type.
        Supports HEAD, Range and conditional (ETag) requests. No API key is needed:
        the file ID is unguessable. Set download=1 to have browsers save the file
        instead of displaying it.'
      parameters:
      - description: File ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Serve the file as an attachment
        in: query
        name: download
        type: boolean
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      summary: Download a file
      tags:
      - files
  /forms:
    get:
      description: Lists the authenticated tenant's forms, newest first, with their
        submission counts.
      parameters:
      - description: Only forms in this state
        in: query
        name: is_active
        type: boolean
      - description: Case-insensitive title substring
        in: query
        name: search
        type: string
      - default: 0
        description: Number of forms to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Maximum number of forms to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of forms
          schema:
            $ref: '#/definitions/handlers.FormListResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List forms
      tags:
      - forms
    post:
      consumes:
      - application/json
      description: Creates a form owned by the authenticated tenant. The slug must
        be unique across all forms. Forms are public and accept anonymous submissions
        unless public_available or accept_anonymous is false; a public form must accept
        anonymous submissions.
      parameters:
      - description: Form to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.FormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Form created
          schema:
            $ref: '#/definitions/handlers.FormResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Slug already exists
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a form
      tags:
      - forms
  /forms/{id}:
    delete:
      description: Deletes one of the authenticated tenant's forms. Forms that have
        submissions or webhooks cannot be deleted.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Form deleted
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Form has submissions or webhooks
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a form
      tags:
      - forms
    get:
      description: Returns one of the authenticated tenant's forms.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Form
          schema:
            $ref: '#/definitions/handlers.FormDetailsResponse'
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a form
      tags:
      - forms
    put:
      consumes:
      - application/json
      description: Replaces every field of one of the authenticated tenant's forms.
        Omitted optional fields are cleared; an omitted is_active, public_available
        or accept_anonymous is true.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      - description: New state of the form
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.FormRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Form updated
          schema:
            $ref: '#/definitions/handlers.FormResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Slug already exists
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update a form
      tags:
      - forms
  /forms/{id}/submissions:
    get:
      description: Lists the submissions of one of the authenticated tenant's forms,
        newest first, with their metadata.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      - default: 0
        description: Number of submissions to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Maximum number of submissions to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of submissions
          schema:
            $ref: '#/definitions/handlers.SubmissionListResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List form submissions
      tags:
      - submissions
  /forms/{id}/webhooks:
    get:
      description: Lists the active webhooks of one of the authenticated tenant's
        forms, oldest first.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Webhooks
          schema:
            $ref: '#/definitions/handlers.WebhookListResponse'
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
