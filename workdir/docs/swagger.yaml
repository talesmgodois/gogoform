  /public/forms/{slug}:
    get:
      description: Returns the form with the given slug if it is active, its tenant
        is active and now is inside its availability window. Forms that are not public_available
        require a signed-in user (bearer token or Basic credentials); credentials
        are optional otherwise.
      parameters:
      - description: Form slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Form
          schema:
            $ref: '#/definitions/handlers.PublicFormResponse'
