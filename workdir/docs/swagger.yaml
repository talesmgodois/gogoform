basePath: /
definitions:
  errors.Code:
    enum:
    - invalid_argument
    - unauthorized
    - forbidden
    - not_found
    - conflict
    - internal
    type: string
    x-enum-varnames:
    - CodeInvalidArgument
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeInternal
  errors.HTTPErrorResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/errors.Code'
        example: not_found
      message:
        example: form not found
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: UP
        type: string
      timestamp:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  main.CreateSubmissionRequest:
    properties:
      completion_time_seconds:
        description: CompletionTimeSeconds is how long the respondent took to fill
          the form in.
        example: 95
        minimum: 0
        type: integer
      payload:
        description: Payload holds the answers; any JSON value but null.
        type: object
    type: object
  main.CreateTenantRequest:
    properties:
      name:
        example: Acme Inc.
        type: string
    type: object
  main.CreateTenantResponse:
    properties:
      api_key:
        example: 3f1c...e9a0
        type: string
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Inc.
        type: string
    type: object
  main.CreateWebhookRequest:
    properties:
      secret_token:
        description: SecretToken, when set, is used to sign deliveries. It is never
          returned.
        example: s3cr3t
        type: string
      target_url:
        description: TargetURL must be a public http(s) URL.
        example: https://example.com/hooks/forms
        type: string
    type: object
  main.FormDetailsResponse:
    properties:
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      tenant_id:
        example: 1
        type: integer
      tenant_name:
        example: Acme Inc.
        type: string
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  main.FormListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/main.FormSummaryResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 1
        type: integer
    type: object
  main.FormRequest:
    properties:
      content:
        description: Content is the form definition (fields, layout); any JSON value
          but null.
        type: object
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      is_active:
        description: IsActive defaults to true when omitted.
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      title:
        example: Contact us
        type: string
    type: object
  main.FormResponse:
    properties:
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      tenant_id:
        example: 1
        type: integer
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  main.FormSummaryResponse:
    properties:
      content:
        type: object
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      slug:
        example: contact-us
        type: string
      start_date:
        example: "2026-01-01T00:00:00Z"
        type: string
      submission_count:
        example: 42
        type: integer
      tenant_id:
        example: 1
        type: integer
      title:
        example: Contact us
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  main.MetadataResponse:
    properties:
      completion_time_seconds:
        example: 95
        type: integer
      ip_address:
        example: 203.0.113.7
        type: string
      referer:
        example: https://example.com/contact
        type: string
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  main.PublicFormResponse:
    properties:
      content:
        type: object
      description:
        example: Get in touch with our team
        type: string
      end_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      slug:
        example: contact-us
        type: string
      title:
        example: Contact us
        type: string
    type: object
  main.SubmissionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/main.SubmissionResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
    type: object
  main.SubmissionResponse:
    properties:
      form_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      metadata:
        $ref: '#/definitions/main.MetadataResponse'
      payload:
        type: object
      submitted_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  main.TenantResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Inc.
        type: string
    type: object
  main.WebhookListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/main.WebhookResponse'
        type: array
    type: object
  main.WebhookResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      form_id:
        example: 1
        type: integer
      has_secret:
        example: true
        type: boolean
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      target_url:
        example: https://example.com/hooks/forms
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API of the application.
  title: App API
  version: "1.0"
paths:
  /forms:
    get:
      description: Lists the authenticated tenant's forms, newest first, with their
        submission counts.
      parameters:
      - description: Only forms in this state
        in: query
        name: is_active
        type: boolean
      - description: Case-insensitive title substring
        in: query
        name: search
        type: string
      - default: 0
        description: Number of forms to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Maximum number of forms to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of forms
          schema:
            $ref: '#/definitions/main.FormListResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List forms
      tags:
      - forms
    post:
      consumes:
      - application/json
      description: Creates a form owned by the authenticated tenant. The slug must
        be unique across all forms.
      parameters:
      - description: Form to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.FormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Form created
          schema:
            $ref: '#/definitions/main.FormResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Slug already exists
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a form
      tags:
      - forms
  /forms/{id}:
    delete:
      description: Deletes one of the authenticated tenant's forms. Forms that have
        submissions or webhooks cannot be deleted.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Form deleted
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Form has submissions or webhooks
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a form
      tags:
      - forms
    get:
      description: Returns one of the authenticated tenant's forms.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Form
          schema:
            $ref: '#/definitions/main.FormDetailsResponse'
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a form
      tags:
      - forms
    put:
      consumes:
      - application/json
      description: Replaces every field of one of the authenticated tenant's forms.
        Omitted optional fields are cleared; an omitted is_active makes the form active.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      - description: New state of the form
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.FormRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Form updated
          schema:
            $ref: '#/definitions/main.FormResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "409":
          description: Slug already exists
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update a form
      tags:
      - forms
  /forms/{id}/submissions:
    get:
      description: Lists the submissions of one of the authenticated tenant's forms,
        newest first, with their metadata.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      - default: 0
        description: Number of submissions to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Maximum number of submissions to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of submissions
          schema:
            $ref: '#/definitions/main.SubmissionListResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List form submissions
      tags:
      - submissions
  /forms/{id}/webhooks:
    get:
      description: Lists the active webhooks of one of the authenticated tenant's
        forms, oldest first.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Webhooks
          schema:
            $ref: '#/definitions/main.WebhookListResponse'
        "400":
          description: Invalid form ID
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List webhooks
      tags:
      - webhooks
    post:
      consumes:
      - application/json
      description: Registers an endpoint notified of the form's new submissions. The
        target must be a public http(s) URL.
      parameters:
      - description: Form ID
        in: path
        name: id
        required: true
        type: integer
      - description: Webhook to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.CreateWebhookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Webhook created
          schema:
            $ref: '#/definitions/main.WebhookResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a webhook
      tags:
      - webhooks
  /healthz:
    get:
      description: Reports whether the service is up and running.
      produces:
      - application/json
      responses:
        "200":
          description: Service is up
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - health
  /public/forms/{slug}:
    get:
      description: Returns the form with the given slug if it is active, its tenant
        is active and now is inside its availability window.
      parameters:
      - description: Form slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Form
          schema:
            $ref: '#/definitions/main.PublicFormResponse'
        "404":
          description: Form not found or not available
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      summary: Get a public form
      tags:
      - public
  /public/forms/{slug}/submissions:
    post:
      consumes:
      - application/json
      description: Stores the answers to a form that can currently be filled in, along
        with the client's IP address, user agent and referer.
      parameters:
      - description: Form slug
        in: path
        name: slug
        required: true
        type: string
      - description: Answers
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.CreateSubmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Submission stored
          schema:
            $ref: '#/definitions/main.SubmissionResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "404":
          description: Form not found or not available
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      summary: Submit a form
      tags:
      - public
  /tenants:
    post:
      consumes:
      - application/json
      description: Registers a new tenant and returns it with a freshly generated
        API key. The key is shown only once; send it in the X-API-Key header of authenticated
        requests.
      parameters:
      - description: Tenant to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tenant created
          schema:
            $ref: '#/definitions/main.CreateTenantResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      summary: Create a tenant
      tags:
      - tenants
  /tenants/me:
    get:
      description: Returns the tenant that owns the API key of the request.
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated tenant
          schema:
            $ref: '#/definitions/main.TenantResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/errors.HTTPErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get the current tenant
      tags:
      - tenants
securityDefinitions:
  ApiKeyAuth:
    description: API key of the tenant, returned when the tenant is created.
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
