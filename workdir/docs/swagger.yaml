securityDefinitions:
  ApiKeyAuth:
    description: API key of the tenant, returned when the tenant is created.
    in: header
    name: X-API-Key
    type: apiKey
  BasicAuth:
    type: basic
  BearerAuth:
    description: JWT returned by POST /auth/signin, sent as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
