<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{template "head" "Forgot password"}}
</head>
<body class="min-h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

{{template "nav" .}}

  <main class="mx-auto max-w-sm px-6 py-16">
    <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
      <h1 class="text-lg font-semibold tracking-tight">Forgot your password?</h1>
      <p class="mt-2 text-sm text-slate-400">Enter your account's email and, if it exists, we'll send a link to reset your password.</p>
      <form method="POST" action="/app/forgot-password" class="mt-6 space-y-4">
        <label class="block space-y-1.5">
          <span class="block text-xs font-medium text-slate-300">Email</span>
          <input name="email" type="email" autocomplete="email" required maxlength="254" autofocus
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none">
        </label>
        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 hover:bg-indigo-500">Send reset link</button>
      </form>
      <p class="mt-6 text-[11px] leading-snug text-slate-500"><a href="/app/signin" class="text-indigo-400 hover:text-indigo-300">Back to sign in</a></p>
    </div>
  </main>

{{template "footer" .}}
</body>
</html>
