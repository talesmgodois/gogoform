<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{template "head" .Doc.Title}}
</head>
<body class="min-h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

{{template "nav" .}}

  <main class="mx-auto flex max-w-6xl flex-col gap-8 px-6 py-10 md:flex-row">
    <nav aria-label="Manual" class="md:w-60 md:shrink-0">
      <p class="text-xs font-semibold uppercase tracking-wider text-indigo-400">Manual</p>
      {{range .Sections}}
      <div class="mt-5">
        <p class="text-xs font-semibold text-slate-400">{{.Title}}</p>
        <ul class="mt-2 space-y-1 text-sm">
          {{range .Docs}}
          <li><a href="/app/help?doc={{.Key}}" data-help-doc="{{.Key}}" class="block rounded-lg px-3 py-1.5 {{if eq .Key $.Doc.Key}}bg-indigo-600/20 text-white{{else}}text-slate-400 hover:bg-slate-900 hover:text-white{{end}}"{{if eq .Key $.Doc.Key}} aria-current="page"{{end}}>{{.Title}}</a></li>
          {{end}}
        </ul>
      </div>
      {{end}}
    </nav>
    <article data-help-article="{{.Doc.Key}}" class="help-prose min-w-0 flex-1 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 sm:p-8">
      {{.Doc.HTML}}
    </article>
  </main>

{{template "footer" .}}
</body>
</html>
