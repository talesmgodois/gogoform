<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{template "head" "Form builder"}}
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

{{template "nav" .}}

  <div id="builder" data-draft="{{.Draft}}" class="flex-1 flex flex-col overflow-hidden">

    <div class="shrink-0 border-b border-slate-800 bg-slate-900/40 px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-sm font-semibold tracking-tight">Form builder</h1>
        <p class="text-xs text-slate-500 truncate">{{with .SourceTitle}}Copy of “{{.}}”. {{end}}Click or drag components onto the form, then create it with a tenant API key.</p>
      </div>
      <div class="flex items-center gap-2 text-xs font-medium">
        <button type="button" id="issues-badge" class="rounded-lg px-3 py-2"></button>
        <button type="button" id="show-json" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-200 hover:bg-slate-700">View JSON</button>
        <button type="button" id="download-json" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-200 hover:bg-slate-700">Download JSON</button>
      </div>
    </div>

    <div class="flex-1 flex overflow-hidden">

      <aside class="w-72 shrink-0 overflow-y-auto border-r border-slate-800 bg-slate-900/50 p-4" aria-labelledby="palette-title">
        <h2 id="palette-title" class="mb-4 text-xs font-bold uppercase tracking-wider text-slate-400">Components</h2>
        <div id="palette" class="space-y-2"></div>
      </aside>

      <main id="stage" class="flex-1 overflow-y-auto p-6">
        <div class="mx-auto w-full max-w-2xl space-y-4">
          <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-xl">
            <input type="text" id="form-title" maxlength="255" placeholder="Form title" aria-label="Form title" class="w-full border-b border-transparent bg-transparent pb-1 text-xl font-bold text-white placeholder:text-slate-600 transition hover:border-slate-700 focus:border-indigo-500 focus:outline-none">
            <textarea id="form-description" rows="2" placeholder="Description shown to respondents (optional)" aria-label="Form description" class="mt-2 w-full resize-none border-b border-transparent bg-transparent text-sm text-slate-400 placeholder:text-slate-600 hover:border-slate-700 focus:border-indigo-500 focus:outline-none"></textarea>
          </div>
          <div id="canvas" class="min-h-[12rem] space-y-3 pb-16" aria-label="Form fields"></div>
        </div>
      </main>

      <aside id="inspector" class="w-80 shrink-0 overflow-y-auto border-l border-slate-800 bg-slate-900/50 p-5" aria-live="polite"></aside>

    </div>
  </div>

  <dialog id="json-dialog" aria-labelledby="json-dialog-title" class="w-full max-w-2xl rounded-2xl border border-slate-800 bg-slate-900 p-0 text-slate-100 shadow-2xl backdrop:bg-slate-950/80 backdrop:backdrop-blur-sm">
    <div class="flex items-center justify-between gap-4 border-b border-slate-800 px-5 py-3">
      <div>
        <h3 id="json-dialog-title" class="text-sm font-semibold">POST /forms request body</h3>
        <p class="text-xs text-slate-500">The <span class="font-mono">content</span> is what respondents' clients render.</p>
      </div>
      <div class="flex shrink-0 items-center gap-2 text-xs font-medium">
        <button type="button" id="copy-json" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-white hover:bg-indigo-500">Copy</button>
        <button type="button" id="close-json" aria-label="Close" class="rounded-lg px-2 py-1.5 text-lg leading-none text-slate-400 hover:bg-slate-800 hover:text-slate-100">&times;</button>
      </div>
    </div>
    <pre id="json-content" class="max-h-[70vh] overflow-auto bg-slate-950 p-5 font-mono text-xs leading-relaxed text-slate-300"></pre>
  </dialog>

  <script nonce="{{.Nonce}}">
    (() => {
      // Component catalog: the types of the "fields" of the form content.
      const TYPES = {
        "textfield": { label: "Text field", hint: "Short answers: names, e-mails", glyph: "Aa", tone: "bg-indigo-500/10 text-indigo-400" },
        "textarea": { label: "Text area", hint: "Long, multi-line answers", glyph: "¶", tone: "bg-sky-500/10 text-sky-400" },
        "select": { label: "Select", hint: "One of a fixed list of options", glyph: "▾", tone: "bg-purple-500/10 text-purple-400" },
        "select-data": { label: "Select (data)", hint: "Options loaded from a URL", glyph: "{ }", tone: "bg-fuchsia-500/10 text-fuchsia-400" },
        "autocomplete-data": { label: "Autocomplete (data)", hint: "Suggestions searched from a URL", glyph: "A…", tone: "bg-amber-500/10 text-amber-400" },
        "file": { label: "File upload", hint: "Documents or images", glyph: "⇪", tone: "bg-emerald-500/10 text-emerald-400" },
        "toggle": { label: "Toggle switch", hint: "Yes / no answer", glyph: "◑", tone: "bg-rose-500/10 text-rose-400" },
      };
      const INPUT_TYPES = ["text", "email", "number", "tel", "url", "date"];
      const NAME_RE = /^[A-Za-z_][A-Za-z0-9_]*$/;
      const SLUG_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;
      const DRAG_TYPE = "text/x-gogoform-type";
      const DRAG_FIELD = "text/x-gogoform-field";

      const INPUT = "w-full rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 text-xs text-slate-200 placeholder:text-slate-600 focus:border-indigo-500 focus:outline-none";
      const PREVIEW = "w-full rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 text-sm text-slate-300 placeholder:text-slate-600";

      const state = { title: "", slug: "", slugEdited: false, description: "", fields: [], selected: null };
      let dirty = false;
      let nextID = 1;

      // h creates an element; string children become text nodes, so user
      // input is never parsed as HTML.
      const h = (tag, props, ...children) => {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
          if (v == null || v === false) continue;
          if (k === "class") el.className = v;
          else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
          else if (k in el && k !== "value") el[k] = v;
          else if (k !== "value") el.setAttribute(k, v === true ? "" : v);
        }
        el.append(...children.flat().filter((c) => c != null && c !== false));
        // A select only accepts a value once its options exist.
        if (props && props.value != null) el.value = props.value;
        return el;
      };
      const $ = (id) => document.getElementById(id);

      // slugify turns a label into a snake_case field name.
      const slugify = (text, sep) => {
        let s = String(text).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
          .replace(/[^a-z0-9]+/g, sep).replace(new RegExp("^" + sep + "+|" + sep + "+$", "g"), "");
        if (sep === "_" && /^[0-9]/.test(s)) s = "f_" + s;
        return s.slice(0, sep === "_" ? 64 : 250).replace(new RegExp(sep + "+$"), "");
      };
      const uniqueName = (base, uid) => {
        base = base || "field";
        const taken = new Set(state.fields.filter((f) => f.uid !== uid).map((f) => f.name));
        let name = base;
        for (let i = 2; taken.has(name); i++) name = base + "_" + i;
        return name;
      };
      const field = (uid) => state.fields.find((f) => f.uid === uid);

      const newField = (type, props) => {
        const f = Object.assign({
          uid: "f" + nextID++, type: type, label: TYPES[type].label, name: "", nameEdited: false,
          help: "", required: false, placeholder: "", inputType: "text", rows: 4,
          options: [{ label: "Option 1", value: "option_1" }, { label: "Option 2", value: "option_2" }],
          source: { url: "", labelKey: "name", valueKey: "id", searchParam: "q" }, minChars: 2,
          accept: "", multiple: false, maxSizeMb: 10, defaultValue: false,
        }, props);
        if (!f.name) f.name = uniqueName(slugify(f.label, "_"), f.uid);
        return f;
      };

      // ---- Content JSON -------------------------------------------------

      const fieldJSON = (f) => {
        const o = { type: f.type, name: f.name, label: f.label };
        if (f.help) o.help = f.help;
        o.required = f.required;
        if (f.placeholder && f.type !== "file" && f.type !== "toggle") o.placeholder = f.placeholder;
        const source = { url: f.source.url, label_key: f.source.labelKey, value_key: f.source.valueKey };
        switch (f.type) {
          case "textfield": o.input_type = f.inputType; break;
          case "textarea": o.rows = f.rows; break;
          case "select": o.options = f.options.map((opt) => ({ label: opt.label, value: opt.value })); break;
          case "select-data": o.data_source = source; break;
          case "autocomplete-data":
            o.data_source = Object.assign(source, { search_param: f.source.searchParam });
            o.min_chars = f.minChars;
            break;
          case "file":
            if (f.accept) o.accept = f.accept;
            o.multiple = f.multiple;
            o.max_size_mb = f.maxSizeMb;
            break;
          case "toggle": o.default = f.defaultValue; break;
        }
        return o;
      };
      const requestBody = () => ({
        title: state.title.trim(),
        slug: state.slug,
        description: state.description.trim() || null,
        content: { version: 1, fields: state.fields.map(fieldJSON) },
      });

      // fromJSON maps a content field back to builder state; unknown types yield null.
      const fromJSON = (o) => {
        if (!o || !TYPES[o.type]) return null;
        const src = o.data_source || {};
        const str = (v, def) => (typeof v === "string" ? v : def);
        const num = (v, def) => (Number.isFinite(v) ? v : def);
        const props = {
          label: str(o.label, TYPES[o.type].label), name: str(o.name, ""), nameEdited: true,
          help: str(o.help, ""), required: o.required === true, placeholder: str(o.placeholder, ""),
          inputType: INPUT_TYPES.includes(o.input_type) ? o.input_type : "text", rows: num(o.rows, 4),
          source: { url: str(src.url, ""), labelKey: str(src.label_key, "name"), valueKey: str(src.value_key, "id"), searchParam: str(src.search_param, "q") },
          minChars: num(o.min_chars, 2), accept: str(o.accept, ""), multiple: o.multiple === true,
          maxSizeMb: num(o.max_size_mb, 10), defaultValue: o.default === true,
        };
        if (Array.isArray(o.options)) {
          props.options = o.options.map((opt) => ({ label: str(opt && opt.label, ""), value: str(opt && opt.value, ""), valueEdited: true }));
        }
        return newField(o.type, props);
      };

      // ---- Validation ---------------------------------------------------

      const issues = () => {
        const out = [];
        const add = (uid, message) => out.push({ uid: uid, message: message });
        const title = state.title.trim();
        if (!title) add(null, "The form needs a title.");
        if (!SLUG_RE.test(state.slug)) add(null, "The slug must be lowercase letters and digits joined by single hyphens.");
        if (!state.fields.length) add(null, "Add at least one component.");
        const names = new Set();
        const isURL = (u) => /^(https?:\/\/|\/)\S+$/.test(u);
        state.fields.forEach((f, i) => {
          const where = "#" + (i + 1) + " " + (f.label || TYPES[f.type].label) + ": ";
          if (!f.label.trim()) add(f.uid, where + "label is required.");
          if (!NAME_RE.test(f.name)) add(f.uid, where + "name must start with a letter or _ and hold only letters, digits and _.");
          else if (names.has(f.name)) add(f.uid, where + "name \"" + f.name + "\" is used twice.");
          names.add(f.name);
          if (f.type === "select") {
            if (!f.options.length) add(f.uid, where + "add at least one option.");
            const values = new Set();
            f.options.forEach((opt) => {
              if (!opt.value) add(f.uid, where + "every option needs a value.");
              else if (values.has(opt.value)) add(f.uid, where + "option value \"" + opt.value + "\" is used twice.");
              values.add(opt.value);
            });
          }
          if (f.type === "select-data" || f.type === "autocomplete-data") {
            if (!isURL(f.source.url)) add(f.uid, where + "data URL must be an http(s) URL or start with /.");
            if (!f.source.labelKey || !f.source.valueKey) add(f.uid, where + "label and value keys are required.");
          }
          if (f.type === "autocomplete-data" && !f.source.searchParam) add(f.uid, where + "search parameter is required.");
          if (f.type === "textarea" && !(f.rows >= 1 && f.rows <= 30)) add(f.uid, where + "rows must be between 1 and 30.");
          if (f.type === "file" && !(f.maxSizeMb > 0)) add(f.uid, where + "maximum size must be above 0.");
        });
        return out;
      };

      // ---- Canvas (the form as respondents see it) ------------------------

      const preview = (f) => {
        const ph = f.placeholder || null;
        switch (f.type) {
          case "textfield":
            return h("input", { type: f.inputType, placeholder: ph, class: PREVIEW, tabIndex: -1 });
          case "textarea":
            return h("textarea", { rows: f.rows, placeholder: ph, class: PREVIEW + " resize-none", tabIndex: -1 });
          case "select":
            return h("select", { class: PREVIEW, tabIndex: -1 },
              h("option", null, ph || "Select an option…"),
              f.options.map((opt) => h("option", null, opt.label)));
          case "select-data":
            return h("div", { class: "space-y-1.5" },
              h("select", { class: PREVIEW, tabIndex: -1 }, h("option", null, ph || "Select an option…")),
              h("p", { class: "font-mono text-[11px] text-slate-500 truncate" }, "options ← " + (f.source.url || "(no URL yet)")));
          case "autocomplete-data":
            return h("div", { class: "space-y-1.5" },
              h("input", { type: "search", placeholder: ph || "Start typing to search…", class: PREVIEW, tabIndex: -1 }),
              h("p", { class: "font-mono text-[11px] text-slate-500 truncate" },
                "suggestions ← " + (f.source.url || "(no URL yet)") + "?" + f.source.searchParam + "=… after " + f.minChars + " characters"));
          case "file":
            return h("div", { class: "rounded-xl border-2 border-dashed border-slate-700 px-4 py-6 text-center" },
              h("p", { class: "text-sm text-slate-300" }, f.multiple ? "Drop files here or browse" : "Drop a file here or browse"),
              h("p", { class: "mt-1 text-[11px] text-slate-500" }, (f.accept || "Any file type") + " · up to " + f.maxSizeMb + " MB" + (f.multiple ? " each" : "")));
          case "toggle":
            return h("div", { class: "flex items-center gap-3" },
              h("span", { class: "relative inline-flex h-6 w-11 shrink-0 rounded-full transition " + (f.defaultValue ? "bg-indigo-600" : "bg-slate-700") },
                h("span", { class: "absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all " + (f.defaultValue ? "left-[1.375rem]" : "left-0.5") })),
              h("span", { class: "text-sm text-slate-400" }, f.defaultValue ? "Yes" : "No"));
        }
      };

      const iconButton = (label, glyph, onclick, danger) =>
        h("button", {
          type: "button", title: label, "aria-label": label,
          class: "grid h-7 w-7 place-items-center rounded-lg text-sm text-slate-500 transition " + (danger ? "hover:bg-rose-500/10 hover:text-rose-400" : "hover:bg-slate-800 hover:text-slate-200"),
          onclick: (e) => { e.stopPropagation(); onclick(); },
        }, glyph);

      const renderCanvas = (problems) => {
        const withIssues = new Set(problems.filter((p) => p.uid).map((p) => p.uid));
        const canvas = $("canvas");
        if (!state.fields.length) {
          canvas.replaceChildren(h("div", { class: "grid place-items-center rounded-2xl border-2 border-dashed border-slate-800 px-6 py-16 text-center" },
            h("p", { class: "text-sm font-medium text-slate-400" }, "Your form is empty"),
            h("p", { class: "mt-1 text-xs text-slate-500" }, "Click a component on the left, or drag it here.")));
          return;
        }
        canvas.replaceChildren(...state.fields.map((f, i) => {
          const selected = f.uid === state.selected;
          const border = selected ? "border-indigo-500 ring-1 ring-indigo-500/40" : withIssues.has(f.uid) ? "border-rose-500/50 hover:border-rose-400/70" : "border-slate-800 hover:border-slate-700";
          return h("div", {
            class: "group relative cursor-pointer rounded-2xl border bg-slate-900 p-5 shadow-xl transition " + border,
            "data-uid": f.uid, draggable: true, tabIndex: 0, role: "button",
            "aria-label": "Edit " + f.label, "aria-pressed": String(selected),
            onclick: (e) => { e.stopPropagation(); select(f.uid); },
            onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(f.uid); } },
            ondragstart: (e) => { e.dataTransfer.setData(DRAG_FIELD, f.uid); e.dataTransfer.effectAllowed = "move"; },
          },
            h("div", { class: "mb-3 flex items-start justify-between gap-3" },
              h("div", { class: "min-w-0" },
                h("p", { class: "text-sm font-semibold text-white break-words" }, f.label || "Untitled field", f.required ? h("span", { class: "text-rose-400" }, " *") : null),
                f.help ? h("p", { class: "mt-0.5 text-xs text-slate-400 break-words" }, f.help) : null),
              h("div", { class: "flex shrink-0 items-center gap-0.5 " + (selected ? "" : "opacity-60 group-hover:opacity-100") },
                iconButton("Move up", "↑", () => move(i, i - 1)),
                iconButton("Move down", "↓", () => move(i, i + 2)),
                iconButton("Duplicate", "⧉", () => duplicate(f.uid)),
                iconButton("Delete", "✕", () => remove(f.uid), true))),
            h("div", { class: "pointer-events-none select-none", inert: true }, preview(f)),
            h("div", { class: "mt-3 flex items-center justify-between text-[10px] font-mono uppercase text-slate-500" },
              h("span", { class: "normal-case" }, f.name),
              h("span", null, f.type)));
        }));
      };

      // ---- Inspector (properties of the selection, or form settings) -----

      const row = (label, control, hint) =>
        h("label", { class: "block space-y-1.5" },
          h("span", { class: "block text-xs font-medium text-slate-300" }, label),
          control,
          hint ? h("span", { class: "block text-[11px] leading-snug text-slate-500" }, hint) : null);
      const text = (value, oninput, props) =>
        h("input", Object.assign({ type: "text", value: value, class: INPUT, oninput: (e) => oninput(e.target.value) }, props));
      const number = (value, oninput, props) =>
        h("input", Object.assign({ type: "number", value: value, class: INPUT, oninput: (e) => oninput(e.target.valueAsNumber) }, props));
      const check = (checked, label, onchange) =>
        h("label", { class: "flex cursor-pointer items-center gap-2 text-xs text-slate-300" },
          h("input", { type: "checkbox", checked: checked, class: "h-4 w-4 rounded border-slate-700 bg-slate-950 accent-indigo-600", onchange: (e) => onchange(e.target.checked) }),
          label);
      const section = (title, ...children) =>
        h("section", { class: "space-y-4 border-t border-slate-800 pt-5 first:border-t-0 first:pt-0" },
          h("h3", { class: "text-xs font-bold uppercase tracking-wider text-slate-400" }, title), ...children);

      const optionRow = (f, opt, i) => {
        const value = text(opt.value, (v) => { opt.value = v; opt.valueEdited = true; changed(); },
          { placeholder: "value", "aria-label": "Option " + (i + 1) + " value", class: INPUT + " font-mono" });
        const label = text(opt.label, (v) => {
          opt.label = v;
          if (!opt.valueEdited) value.value = opt.value = slugify(v, "_");
          changed();
        }, { placeholder: "Label", "aria-label": "Option " + (i + 1) + " label" });
        return h("div", { class: "flex items-center gap-1.5" }, label, value,
          iconButton("Remove option", "✕", () => { f.options.splice(i, 1); changed(true); }, true));
      };
      const optionsEditor = (f) =>
        h("div", { class: "space-y-2" },
          h("span", { class: "block text-xs font-medium text-slate-300" }, "Options"),
          f.options.map((opt, i) => optionRow(f, opt, i)),
          h("button", {
            type: "button", class: "text-xs font-medium text-indigo-400 hover:underline",
            onclick: () => {
              const n = f.options.length + 1;
              f.options.push({ label: "Option " + n, value: "option_" + n });
              changed(true);
            },
          }, "+ Add option"));

      const dataSourceInputs = (f) => [
        row("Data URL", text(f.source.url, (v) => { f.source.url = v.trim(); changed(); }, { placeholder: "https://api.example.com/cities", class: INPUT + " font-mono" }),
          "Must return a JSON array of objects."),
        h("div", { class: "grid grid-cols-2 gap-3" },
          row("Label key", text(f.source.labelKey, (v) => { f.source.labelKey = v.trim(); changed(); }, { class: INPUT + " font-mono" })),
          row("Value key", text(f.source.valueKey, (v) => { f.source.valueKey = v.trim(); changed(); }, { class: INPUT + " font-mono" }))),
      ];

      const typeInputs = (f) => {
        const placeholder = () => row("Placeholder", text(f.placeholder, (v) => { f.placeholder = v; changed(); }));
        switch (f.type) {
          case "textfield":
            return [
              row("Input type", h("select", { class: INPUT, value: f.inputType, onchange: (e) => { f.inputType = e.target.value; changed(); } },
                INPUT_TYPES.map((t) => h("option", { value: t }, t)))),
              placeholder(),
            ];
          case "textarea":
            return [placeholder(), row("Rows", number(f.rows, (v) => { f.rows = v; changed(); }, { min: 1, max: 30 }))];
          case "select":
            return [placeholder(), optionsEditor(f)];
          case "select-data":
            return [placeholder(), ...dataSourceInputs(f)];
          case "autocomplete-data":
            return [
              placeholder(), ...dataSourceInputs(f),
              h("div", { class: "grid grid-cols-2 gap-3" },
                row("Search parameter", text(f.source.searchParam, (v) => { f.source.searchParam = v.trim(); changed(); }, { class: INPUT + " font-mono" })),
                row("Min. characters", number(f.minChars, (v) => { f.minChars = Math.max(0, v || 0); changed(); }, { min: 0 }))),
            ];
          case "file":
            return [
              row("Accepted types", text(f.accept, (v) => { f.accept = v.trim(); changed(); }, { placeholder: "image/*,.pdf", class: INPUT + " font-mono" }),
                "Comma-separated MIME types or extensions; empty accepts anything."),
              row("Max. size (MB)", number(f.maxSizeMb, (v) => { f.maxSizeMb = v; changed(); }, { min: 1 })),
              check(f.multiple, "Allow several files", (v) => { f.multiple = v; changed(); }),
            ];
          case "toggle":
            return [check(f.defaultValue, "On by default", (v) => { f.defaultValue = v; changed(); })];
        }
      };

      const fieldInspector = (f) => {
        let nameInput;
        return [
          h("div", { class: "mb-5 flex items-center justify-between gap-3" },
            h("div", { class: "flex items-center gap-2" },
              h("span", { class: "grid h-8 w-8 place-items-center rounded-lg font-mono text-xs font-bold " + TYPES[f.type].tone }, TYPES[f.type].glyph),
              h("h2", { class: "text-sm font-semibold" }, TYPES[f.type].label)),
            h("button", { type: "button", class: "rounded-lg px-2 py-1 text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white", onclick: () => select(null) }, "Done")),
          h("div", { class: "space-y-5" },
            section("Field",
              row("Label", text(f.label, (v) => {
                f.label = v;
                if (!f.nameEdited) {
                  f.name = uniqueName(slugify(v, "_"), f.uid);
                  nameInput.value = f.name;
                }
                changed();
              }, { maxLength: 255 })),
              row("Name", (nameInput = text(f.name, (v) => { f.name = v.trim(); f.nameEdited = true; changed(); }, { class: INPUT + " font-mono" })),
                "Key of the answer in the submission payload."),
              row("Help text", text(f.help, (v) => { f.help = v; changed(); })),
              check(f.required, "Required", (v) => { f.required = v; changed(); })),
            section("Settings", ...typeInputs(f)),
            h("button", { type: "button", class: "w-full rounded-lg border border-rose-500/30 px-3 py-2 text-xs font-medium text-rose-300 hover:bg-rose-500/10", onclick: () => remove(f.uid) }, "Delete component")),
        ];
      };

      const create = { key: "", busy: false, result: null };
      const canCreate = (problems) => !create.busy && create.key !== "" && !problems.length;

      const settingsInspector = () => [
        h("div", { class: "space-y-5" },
          section("Form settings",
            row("Slug", text(state.slug, (v) => { state.slug = v.trim(); state.slugEdited = true; changed(); }, { id: "form-slug", maxLength: 255, class: INPUT + " font-mono" }),
              "Public address: /public/forms/{slug}. Must be unique.")),
          section("Checks", h("div", { id: "checks" })),
          section("Create form",
            h("p", { class: "text-xs leading-snug text-slate-500" }, "The form is created for the tenant owning the API key. The key is only sent with this request and is not stored."),
            row("Tenant API key", text(create.key, (v) => { create.key = v.trim(); renderStatus(issues()); },
              { type: "password", autocomplete: "off", class: INPUT + " font-mono" })),
            h("button", {
              type: "button", id: "create-form",
              class: "w-full rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white shadow-lg shadow-indigo-600/25 hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none",
              onclick: submit,
            }),
            h("div", { id: "create-result" }))),
      ];

      // renderStatus refreshes the parts of the form settings that follow the
      // edits, without rebuilding the inputs being typed in.
      const renderStatus = (problems) => {
        if (!$("checks")) return;
        $("checks").replaceChildren(problems.length
          ? h("ul", { class: "space-y-1.5" }, problems.map((p) =>
            h("li", null, h("button", {
              type: "button", class: "w-full rounded-lg bg-rose-500/5 px-3 py-2 text-left text-xs text-rose-300 hover:bg-rose-500/10",
              onclick: () => { if (p.uid) select(p.uid); else if (!state.title.trim()) $("form-title").focus(); },
            }, p.message))))
          : h("p", { class: "rounded-lg bg-emerald-500/5 px-3 py-2 text-xs text-emerald-300" }, "Everything looks good."));
        const button = $("create-form");
        button.disabled = !canCreate(problems);
        button.textContent = create.busy ? "Creating…" : "Create form";
        $("create-result").replaceChildren(...(create.result ? [create.result] : []));
      };

      const renderInspector = (problems) => {
        const f = field(state.selected);
        $("inspector").replaceChildren(...(f ? fieldInspector(f) : settingsInspector()));
        renderStatus(problems);
      };

      const renderBadge = (problems) => {
        const badge = $("issues-badge");
        badge.textContent = problems.length ? problems.length + (problems.length === 1 ? " issue" : " issues") : "Ready";
        badge.className = "rounded-lg px-3 py-2 ring-1 ring-inset " + (problems.length ? "bg-rose-500/10 text-rose-300 ring-rose-500/20 hover:bg-rose-500/20" : "bg-emerald-500/10 text-emerald-300 ring-emerald-500/20");
      };

      // changed re-renders after an edit; the inspector is only rebuilt on
      // request since that would steal the focus of the input being typed in.
      const changed = (rebuildInspector) => {
        dirty = true;
        create.result = null;
        render(rebuildInspector);
      };
      const render = (rebuildInspector) => {
        const problems = issues();
        renderCanvas(problems);
        renderBadge(problems);
        if (rebuildInspector) renderInspector(problems);
        else renderStatus(problems);
      };

      const select = (uid) => {
        state.selected = uid;
        render(true);
        if (uid) {
          const card = document.querySelector('[data-uid="' + uid + '"]');
          if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      };

      // ---- Editing ------------------------------------------------------

      const insert = (f, index) => {
        state.fields.splice(index == null ? state.fields.length : index, 0, f);
        dirty = true;
        create.result = null;
        select(f.uid);
      };
      // move puts the field at index from before position to (0..length).
      const move = (from, to) => {
        if (to < 0 || to > state.fields.length) return;
        const [f] = state.fields.splice(from, 1);
        state.fields.splice(to > from ? to - 1 : to, 0, f);
        changed();
      };
      const duplicate = (uid) => {
        const src = field(uid);
        const props = JSON.parse(JSON.stringify(src));
        delete props.uid;
        props.name = uniqueName(src.name);
        insert(newField(src.type, props), state.fields.indexOf(src) + 1);
      };
      const remove = (uid) => {
        state.fields = state.fields.filter((f) => f.uid !== uid);
        if (state.selected === uid) state.selected = null;
        changed(true);
      };

      // ---- Drag and drop ------------------------------------------------

      const indicator = h("div", { class: "h-1 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50" });
      const dropIndex = (y) => {
        const cards = [...$("canvas").querySelectorAll("[data-uid]")];
        const i = cards.findIndex((card) => {
          const box = card.getBoundingClientRect();
          return y < box.top + box.height / 2;
        });
        return i === -1 ? cards.length : i;
      };
      const isOurDrag = (e) => e.dataTransfer.types.includes(DRAG_TYPE) || e.dataTransfer.types.includes(DRAG_FIELD);
      const stage = $("stage");
      stage.addEventListener("dragover", (e) => {
        if (!isOurDrag(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = e.dataTransfer.types.includes(DRAG_FIELD) ? "move" : "copy";
        if (!state.fields.length) return;
        const cards = $("canvas").querySelectorAll("[data-uid]");
        const i = dropIndex(e.clientY);
        if (i < cards.length) cards[i].before(indicator);
        else cards[cards.length - 1].after(indicator);
      });
      stage.addEventListener("dragleave", (e) => {
        if (!stage.contains(e.relatedTarget)) indicator.remove();
      });
      stage.addEventListener("drop", (e) => {
        if (!isOurDrag(e)) return;
        e.preventDefault();
        indicator.remove();
        const i = dropIndex(e.clientY);
        const type = e.dataTransfer.getData(DRAG_TYPE);
        const uid = e.dataTransfer.getData(DRAG_FIELD);
        if (TYPES[type]) insert(newField(type), i);
        else if (field(uid)) move(state.fields.indexOf(field(uid)), i);
      });
      document.addEventListener("dragend", () => indicator.remove());

      // ---- Output -------------------------------------------------------

      const bodyText = () => JSON.stringify(requestBody(), null, 2);

      const submit = () => {
        const problems = issues();
        if (!canCreate(problems)) return;
        create.busy = true;
        create.result = null;
        renderStatus(problems);
        fetch("/forms", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": create.key },
          body: bodyText(),
        })
          .then((res) => res.json().catch(() => ({})).then((data) => ({ res: res, data: data })))
          .then(({ res, data }) => {
            if (!res.ok) throw new Error(data.message || "HTTP " + res.status);
            dirty = false;
            create.result = h("div", { class: "rounded-lg bg-emerald-500/10 px-3 py-2 text-xs text-emerald-300" },
              "Form created. ", h("a", { href: "/app/forms/" + encodeURIComponent(data.id), class: "font-semibold underline" }, "View its submissions"));
          })
          .catch((err) => {
            create.result = h("p", { class: "rounded-lg bg-rose-500/10 px-3 py-2 text-xs text-rose-300", role: "alert" }, "Could not create the form: " + err.message);
          })
          .finally(() => {
            create.busy = false;
            renderStatus(issues());
          });
      };

      const dialog = $("json-dialog");
      $("show-json").addEventListener("click", () => {
        $("json-content").textContent = bodyText();
        dialog.showModal();
      });
      $("close-json").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
      $("copy-json").addEventListener("click", (e) => {
        const button = e.currentTarget;
        navigator.clipboard.writeText(bodyText()).then(
          () => { button.textContent = "Copied"; },
          () => { button.textContent = "Copy failed"; },
        );
        setTimeout(() => { button.textContent = "Copy"; }, 2000);
      });
      $("download-json").addEventListener("click", () => {
        const url = URL.createObjectURL(new Blob([bodyText() + "\n"], { type: "application/json" }));
        const a = h("a", { href: url, download: (state.slug || "form") + ".json" });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      });
      $("issues-badge").addEventListener("click", () => select(null));

      // ---- Form header, palette and start-up -----------------------------

      $("form-title").addEventListener("input", (e) => {
        state.title = e.target.value;
        if (!state.slugEdited) {
          state.slug = slugify(state.title, "-");
          if ($("form-slug")) $("form-slug").value = state.slug;
        }
        changed();
      });
      $("form-description").addEventListener("input", (e) => {
        state.description = e.target.value;
        changed();
      });
      $("canvas").addEventListener("click", () => select(null));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.selected && !dialog.open) select(null);
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty) e.preventDefault();
      });

      $("palette").replaceChildren(...Object.entries(TYPES).map(([type, t]) =>
        h("button", {
          type: "button", draggable: true,
          class: "group flex w-full items-center gap-3 rounded-xl border border-slate-800 bg-slate-900 p-3 text-left transition hover:border-indigo-500/50 hover:bg-slate-800/80",
          onclick: () => insert(newField(type), state.selected ? state.fields.indexOf(field(state.selected)) + 1 : null),
          ondragstart: (e) => { e.dataTransfer.setData(DRAG_TYPE, type); e.dataTransfer.effectAllowed = "copy"; },
        },
          h("span", { class: "grid h-9 w-9 shrink-0 place-items-center rounded-lg font-mono text-xs font-bold transition group-hover:scale-110 " + t.tone }, t.glyph),
          h("span", { class: "min-w-0" },
            h("span", { class: "block text-xs font-semibold text-white" }, t.label),
            h("span", { class: "block text-[11px] text-slate-400" }, t.hint)))));

      const draft = $("builder").dataset.draft;
      if (draft) {
        const d = JSON.parse(draft);
        state.title = d.title || "";
        state.slug = d.slug || "";
        state.slugEdited = true;
        state.description = d.description || "";
        const fields = d.content && Array.isArray(d.content.fields) ? d.content.fields : [];
        state.fields = fields.map(fromJSON).filter(Boolean);
        if (state.fields.length < fields.length || !(d.content && Array.isArray(d.content.fields))) {
          create.result = h("p", { class: "rounded-lg bg-amber-500/10 px-3 py-2 text-xs text-amber-300" },
            "Some of the source form's content is not in the builder's format and was left out.");
        }
      }
      $("form-title").value = state.title;
      $("form-description").value = state.description;
      render(true);
    })();
  </script>
</body>
</html>
