<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{template "head" "Reset password"}}
</head>
<body class="min-h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

{{template "nav" .}}

  <main class="mx-auto max-w-sm px-6 py-16">
    <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
      <h1 class="text-lg font-semibold tracking-tight">Choose a new password</h1>
      {{if .Error}}<p role="alert" class="mt-4 rounded-lg bg-rose-500/10 px-3 py-2 text-xs text-rose-300">{{.Error}}</p>{{end}}
      <form method="POST" action="/app/reset-password" class="mt-6 space-y-4">
        <input type="hidden" name="token" value="{{.Token}}">
        <label class="block space-y-1.5">
          <span class="block text-xs font-medium text-slate-300">New password</span>
          <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" autofocus
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 focus:border-indigo-500 focus:outline-none">
          <span class="block text-[11px] text-slate-500">8 to 72 characters.</span>
        </label>
        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 hover:bg-indigo-500">Reset password</button>
      </form>
    </div>
  </main>

{{template "footer" .}}
</body>
</html>
