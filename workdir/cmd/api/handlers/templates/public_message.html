<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
{{/* Embed mode drops the page background and margins so the card fits the
    host site's iframe. */}}
<body class="{{if .Embed}}bg-transparent{{else}}min-h-full bg-slate-950{{end}} text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <main class="{{if .Embed}}p-2{{else}}mx-auto max-w-2xl px-6 py-12{{end}}">
    <section class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 text-center shadow-xl sm:p-8">
      {{with .FormTitle}}<p class="text-xs font-medium uppercase tracking-wide text-slate-500 break-words">{{.}}</p>{{end}}
      <h1 class="mt-2 text-2xl font-bold tracking-tight">{{.Title}}</h1>
      <p class="mt-3 text-sm text-slate-400">{{.Message}}</p>
      {{if .Href}}<a href="{{.Href}}"{{if .TopLevel}} target="_top"{{end}} class="mt-8 inline-block rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-500">{{.Link}}</a>{{end}}
    </section>

{{template "powered-by" .PoweredBy}}
  </main>
</body>
</html>
