version: "2"
sql:
  - engine: "postgresql"
    # dbmate migrations are the schema source of truth; sqlc only reads
    # their "-- migrate:up" blocks.
    schema: "db/postgres/migrations"
    queries: "db/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true
        # Nullable columns become *T (nil == NULL) instead of pgtype.X wrappers.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
