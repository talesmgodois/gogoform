name: Deploy

# Builds and publishes the API image. Pushes to `main` publish to the
# GitHub Container Registry image named by the REGISTRY_MAIN_BRANCH
# repository variable; pushing a tag publishes a release to the registry
# named by the REGISTRY_RELEASES repository variable (e.g. Docker Hub).
#
# Configure under Settings > Secrets and variables > Actions:
#   Variables: REGISTRY_MAIN_BRANCH (e.g. ghcr.io/OWNER/gogoform)
#              REGISTRY_RELEASES    (e.g. docker.io/OWNER/gogoform)
#   Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (only needed for tag pushes)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select target registry
        id: target
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "image=${{ vars.REGISTRY_RELEASES }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ vars.REGISTRY_MAIN_BRANCH }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.target.outputs.is_release == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.target.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
