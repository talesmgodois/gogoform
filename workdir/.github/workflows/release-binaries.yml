name: Release binaries

# Cross-compiles the API binary for Linux and Windows on tag pushes and
# attaches the archives as assets on the corresponding GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -o "dist/gogoform${{ matrix.ext }}" ./cmd/api

      - name: Archive binary
        id: archive
        run: |
          cd dist
          name="gogoform_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="${name}.zip"
            zip "$archive" "gogoform${{ matrix.ext }}"
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" "gogoform${{ matrix.ext }}"
          fi
          echo "path=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.path }}
