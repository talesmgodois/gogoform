[server]
port = 8080
env = "development"

[logger]
level = "debug"

[database]
# Pick the engine by changing the scheme: postgres:// (default) or sqlite:.
uri = "postgres://postgres:postgres@localhost:5432/app_db?sslmode=disable"
# uri = "sqlite:./data/gogoform.db"

# SQLite-only tuning, ignored on PostgreSQL.
# How long a writer waits for a lock before failing with SQLITE_BUSY.
# sqlite_busy_timeout_ms = 5000
# Journal mode: WAL (default, concurrent readers), DELETE or TRUNCATE.
# sqlite_journal_mode = "WAL"

# Apply pending migrations at startup (recorded in dbmate's schema_migrations,
# so `make migrate-*` keeps working). Defaults to true on SQLite and false on
# PostgreSQL, where migrations usually run as a separate deploy step.
# auto_migrate = true

# HTTP Basic credentials of the read-only /app dashboard, which lists every
# tenant's forms and files. The dashboard is disabled while they are unset.
# Prefer APP_USERNAME / APP_PASSWORD over committing them here.
[app]
# username = "admin"
# password = "change-me"

# User accounts (JWT and HTTP Basic). Prefer the AUTH_* environment variables
# for secrets. Without a jwt_secret (at least 32 bytes) a random one is
# generated at startup, so tokens do not survive a restart.
[auth]
token_ttl_minutes = 60
# jwt_secret = ""
# Bootstrap ADMIN account, created at startup when the username is free.
# admin_username = "admin"
# admin_password = "change-me-now"
